name: Build Zhongda Architecture Quiz APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Check question bank
        run: test -f www/index.html

      - name: Copy question bank into Android assets
        run: |
          mkdir -p app/src/main/assets
          cp www/index.html app/src/main/assets/index.html

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhongda-architecture-quiz-debug
          path: app/build/outputs/apk/debug/app-debug.apk
