:"D","desc":"芝加哥学派重点在高层建筑、钢框架及功能与形式关系等方面，强调高层城市规划并非其典型主张。"},{"type":"single","q":"有关“多米诺体系”说法错误的是（）。","options":["A.由勒·柯布西耶提出","B.底层采用独立柱","C.采用横向长窗","D.设有从底到顶的花园"],"right":3,"ans":"D","desc":"多米诺体系是独立柱、自由平面等现代建筑结构体系；“从底到顶的花园”并非其基本构成。"},{"type":"single","q":"有关赖特草原式住宅，错误的是（）。","options":["A.体现“有机建筑”思想","B.通常采用十字形平面","C.强调水平延展的水平线条","D.多采用低矮的屋顶"],"right":1,"ans":"B","desc":"草原式住宅强调水平性、低矮屋顶和有机性，但“通常采用十字形平面”并非其必然特征。"},{"type":"single","q":"下列属于阿尔瓦·阿尔托作品的是（）。","options":["A.帕米欧肺病疗养院","B.罗比住宅","C.巴塞罗那德国馆","D.范斯沃斯住宅"],"right":0,"ans":"A","desc":"帕米欧肺病疗养院是阿尔瓦·阿尔托的代表作。"},{"type":"single","q":"图示悬挂结构建筑物是（）。","options":["A.明尼阿波利斯联邦储备银行","B.巴黎联合国教科文组织总部","C.芝加哥会议中心","D.纽约联合国总部"],"right":0,"ans":"A","desc":"题目解析指出明尼阿波利斯联邦储备银行采用著名的悬挂结构。"},{"type":"single","q":"属于二战后“典雅主义”建筑思潮代表作品的是（）。","options":["A.哈佛大学研究生中心","B.芝加哥湖滨公寓","C.纽约林肯文化中心","D.蓬皮杜国家艺术与文化中心"],"right":2,"ans":"C","desc":"纽约林肯文化中心体现二战后典雅主义对传统美学形式、比例和秩序的追求。"},{"type":"single","q":"下列哪项建筑由柯布西耶设计并体现“新建筑五点”？","options":["A.萨伏伊别墅","B.流水别墅","C.范斯沃斯住宅","D.朗香教堂"],"right":0,"ans":"A","desc":"萨伏伊别墅体现底层架空、屋顶花园、自由平面、横向长窗和自由立面等“新建筑五点”。"},{"type":"single","q":"以下哪栋建筑由伦佐·皮亚诺设计？（）。","options":["A.罗马国家艺术博物馆","B.吉隆坡石油双塔","C.芝加哥文化中心","D.悉尼歌剧院"],"right":2,"ans":"C","desc":"伦佐·皮亚诺的代表作品包括芝加哥文化中心等；其设计强调现代技术与空间处理。"},{"type":"single","q":"1964年公布的保护历史性城镇的宪章是（）。","options":["A.华盛顿宪章","B.威尼斯宪章","C.北京宪章","D.佛罗伦萨宪章"],"right":1,"ans":"B","desc":"1964年在威尼斯通过《国际古迹保护与修复宪章》，即《威尼斯宪章》。"},{"type":"single","q":"有关中国古代城市的说法，错误的是（）。","options":["A.中国古代城市有统治机构、手工业商业区和居民区三个基本要素","B.里坊制度在唐宋时期确立并达到成熟","C.宋代出现了开放式街市","D.城市空间始终保持严格封闭的里坊格局"],"right":3,"ans":"D","desc":"宋代商品经济发展后出现开放式街市，里坊制度的封闭性逐渐被打破，因此“始终保持严格封闭”错误。"},{"type":"single","q":"黄河中上游利用黄土断崖挖出横穴居室的民居叫做（）。","options":["A.地坑院","B.一颗印","C.窑洞","D.土楼"],"right":2,"ans":"C","desc":"利用黄土断崖横向开挖的穴居形式属于窑洞。"},{"type":"single","q":"我国已知最早采用夯土墙的房屋是（）。","options":["A.西安半坡遗址","B.余姚河姆渡遗址","C.仰韶文化遗址","D.西安龙山文化遗址"],"right":2,"ans":"C","desc":"题目所给解析将较早出现夯土墙等构造的遗址归于仰韶文化相关遗存。"},{"type":"single","q":"有关汉代建筑特点的说法，错误的是（）。","options":["A.建筑形式逐渐形成基本统一的形式","B.抬梁式和穿斗式等结构形式已经出现","C.庑殿和歇山是汉代最常用的屋顶形式","D.木构技术和斗拱等方面有较大进步"],"right":2,"ans":"C","desc":"汉代木构技术已有发展，但不能简单认为庑殿和歇山已成为汉代最常用的屋顶形式。"},{"type":"single","q":"有关应县木塔的说法，错误的是（）。","options":["A.建于辽代","B.采用“前塔后殿”布局","C.采用“分心柱”对称形式","D.具有较高的木构技术成就"],"right":1,"ans":"B","desc":"应县木塔为辽代木构楼阁式塔；题目解析指出“前塔后殿”并非其平面布局特征。"},{"type":"single","q":"以下有关古代木构建筑说法错误的是（）。","options":["A.用一列柱将平面等分的方法叫“分心”","B.檐柱上纵向和承重的水平构件为梁","C.宋代铺作构件与柱头、梁等有明确构造关系","D.元代补间铺作一般较为繁复"],"right":3,"ans":"D","desc":"题目解析强调不同朝代铺作制度有差异，元代补间铺作并非一般都更繁复。"},{"type":"single","q":"以下建筑技术不属于古罗马发明的是（）。","options":["A.拱券","B.混凝土","C.十字拱顶体系","D.木构桁架"],"right":3,"ans":"D","desc":"古罗马在拱券、混凝土和拱顶体系方面成就突出，木构桁架并非其代表性发明。"},{"type":"single","q":"有关佛罗伦萨主教堂穹顶的说法正确的是（）。","options":["A.采用单层拱结构","B.采用双圆心尖券形式","C.由米开朗琪罗设计","D.模仿古罗马万神庙穹顶的单层结构"],"right":1,"ans":"B","desc":"布鲁内莱斯基设计的佛罗伦萨主教堂穹顶采用双层壳体、双圆心尖券等创新结构。"},{"type":"single","q":"19世纪50年代英国“艺术与工艺”运动中，莫里斯“红屋”相关描述错误的是（）。","options":["A.属于新艺术运动","B.采用当地红砖建造","C.反映工艺与手工传统","D.功能、材料与艺术形式结合"],"right":0,"ans":"A","desc":"红屋属于“艺术与工艺”运动的重要作品，并非新艺术运动作品。"},{"type":"single","q":"对提高住宅节能特征影响最小的是（）。","options":["A.住宅外墙保温性能","B.住宅外门窗隔热性能","C.住宅屋顶保温性能","D.室内装饰色彩"],"right":3,"ans":"D","desc":"围护结构保温性能直接影响建筑节能，室内装饰色彩对住宅整体节能特征影响相对较小。"},{"type":"single","q":"适合儿童室内活动地方的地面材质是（）。","options":["A.磨光石材","B.实木地板","C.大理石地面","D.水磨石地面"],"right":1,"ans":"B","desc":"实木地板相对柔软、有一定弹性，儿童活动时安全性较好。"},{"type":"single","q":"有关柯布西耶设计的朗香教堂，说法错误的是（）。","options":["A.采用曲线形体","B.南立面简洁开窗","C.具有强烈雕塑性","D.采用白色墙面"],"right":1,"ans":"B","desc":"朗香教堂以曲线形体、厚重墙体和雕塑性著称，并非以南立面简洁开窗为主要特征。"},{"type":"single","q":"人际距离中的社会距离具体尺寸是多少？","options":["A.0～0.45m","B.0.45～1.2m","C.1.2～3.6m","D.3.6～7.5m"],"right":2,"ans":"C","desc":"人际距离通常分为亲密距离、个人距离、社会距离和公共距离；社会距离约为1.2～3.6m。"},{"type":"single","q":"关于凯文·林奇城市设计五要素的说法，错误的是（）。","options":["A.区域可以从内部辨认，也可从外部确认","B.节点是城市中的重要交叉点或集中点","C.边界是城市空间的分隔线","D.标志物是城市中容易识别的特定物体"],"right":0,"ans":"A","desc":"林奇五要素包括道路、边界、区域、节点和标志物；区域既可由内部识别，也常可由外部辨认。"},{"type":"single","q":"有关被动式太阳能房间设计，错误的是（）。","options":["A.南向采光房间进深不宜过大","B.房间高度不宜小于2.9m","C.采暖为主地区主要房间宜考虑冬季主导风向","D.全天使用房间宜采用直接受益式集热方式"],"right":1,"ans":"B","desc":"题目解析指出相关规范要求房间高度不宜小于2.8m，故“2.9m”这一表述错误。"},{"type":"single","q":"有关南方地区住宅节能设计，错误的是（）。","options":["A.宜采用南北向或接近南北向","B.夏热冬冷地区住宅体形系数不宜大于0.40","C.南、北向外窗应采取建筑外遮阳措施","D.宜采用小面宽、大进深"],"right":1,"ans":"B","desc":"题目解析指出相关地区住宅体形系数限值并非统一为0.40，该项表述错误。"},{"type":"single","q":"下列全部属于绿色建材的是（）。","options":["A.黏土砖、石棉板、木材","B.钢材、木材、生土","C.沥青、钢材、石棉","D.生土、木材、石材"],"right":3,"ans":"D","desc":"绿色建材强调节能、环保、安全、耐久和可循环利用等特征；生土、木材、石材可在相应条件下作为绿色建材。"},{"type":"single","q":"张择端《清明上河图》描绘的古代城市是（）。","options":["A.洛阳","B.长安","C.汴京","D.开封"],"right":2,"ans":"C","desc":"《清明上河图》描绘北宋都城汴京的城市生活与商业景象。"},{"type":"single","q":"以下关于明南京城的说法，错误的是（）。","options":["A.采用不规则的城市布局","B.城南是居民和商业区","C.皇城位于城市中央","D.利用复杂地形组织城市空间"],"right":2,"ans":"C","desc":"明南京城因地形形成独特的不规则布局，皇城位于城东部而非城市中央。"},{"type":"single","q":"唐代建筑的主要特点是（）。","options":["A.规模宏大、规划严整","B.完全采用砖石结构","C.木构架建筑采用复杂的后世斗拱体系","D.建筑色彩以白色为主"],"right":0,"ans":"A","desc":"唐代建筑总体呈现规模宏大、气势雄浑、规划严整和木构技术成熟等特点。"},{"type":"single","q":"《马丘比丘宪章》的主张是（）。","options":["A.把小汽车作为城市主要交通工具","B.注意交通发展与能源危机之间取得平衡","C.城市规划只强调功能分区","D.只强调工业城市扩张"],"right":1,"ans":"B","desc":"《马丘比丘宪章》反思功能分区和汽车导向，强调综合、整体的城市规划以及交通与能源问题。"},{"type":"single","q":"按现行规范，人行道的颜色宜为（）。","options":["A.淡色","B.中黄色","C.红色","D.黑色"],"right":1,"ans":"B","desc":"无障碍环境建设等相关设计中，人行道铺装宜采用中黄色等具有识别性的色彩。"},{"type":"single","q":"我国一般建筑物屋顶材料首先应综合满足哪组要求？","options":["A.经济、美观、实用","B.强度、坚固、卫生","C.可燃、隔声、防腐","D.防火、防水、保温"],"right":3,"ans":"D","desc":"建筑屋面首先需要综合满足防火、防水、保温等基本性能要求。"},{"type":"single","q":"倒置式屋面的排水方式，以选择下列何者为宜？","options":["A.无组织排水","B.檐沟排水","C.天沟排水","D.有组织无天沟排水"],"right":3,"ans":"D","desc":"倒置式屋面保温层位于防水层上方，应尽量采用有组织、无天沟的排水方式，减少渗漏风险。"},{"type":"single","q":"机动车停车场地坡度不应小于0.3%，其主要理由是（）。","options":["A.增加绿化面积","B.保证结构稳定","C.满足排水要求","D.便于车辆沿坡停放"],"right":2,"ans":"C","desc":"停车场地设置最小坡度主要是为了满足排水要求，避免积水。"},{"type":"single","q":"以祠堂为中心、中轴对称且具有单元式住宅特征的民居是（）。","options":["A.北京四合院","B.客家土楼","C.窑洞","D.徽州民居"],"right":1,"ans":"B","desc":"客家土楼具有以祠堂为中心、围合组织和中轴性等特点，内部包含居住单元。"},{"type":"single","q":"第二次世界大战后，工业发达国家城市的大城市规划主要着眼于哪方面工作？","options":["A.城市核心区开发","B.扩建城市中心","C.城市外围建立卫星城","D.只进行旧城改造"],"right":2,"ans":"C","desc":"战后大城市出现拥挤等问题，规划的重要方向之一是在城市外围建立卫星城，以疏解人口和功能。"},{"type":"single","q":"住宅户门、厨房、卫生间门的最小洞口宽度分别不应小于（）。","options":["A.900、800、700mm","B.1000、800、700mm","C.900、900、700mm","D.1000、800、800mm"],"right":1,"ans":"B","desc":"住宅设计相关规范给出的典型最小洞口宽度为户门1000mm、厨房800mm、卫生间700mm。"},{"type":"single","q":"“体形环境”建筑设计教学思想是由哪位提出的？","options":["A.梁思成","B.赖特","C.贝聿铭","D.杨廷宝"],"right":1,"ans":"B","desc":"题目所给资料将“体形环境”建筑设计教学思想归于赖特相关的有机建筑思想。"},{"type":"single","q":"清代斗拱一般不包括以下哪种功能？","options":["A.模数化","B.结构承重","C.装饰","D.等级象征"],"right":1,"ans":"B","desc":"清代斗拱的结构承重作用相较唐宋明显弱化，更多体现模数、装饰和等级象征。"},{"type":"single","q":"CIAM第四次会议的主题是（）。","options":["A.建筑工业化","B.城市规划","C.居住与休闲","D.住宅空间的品质标准"],"right":1,"ans":"B","desc":"1933年CIAM第四次会议即“雅典会议”，围绕“功能城市”和城市规划问题展开。"},{"type":"single","q":"我国已知最早的庭院式建筑是（）。","options":["A.西安半坡遗址","B.陕西临潼姜寨遗址","C.河南偃师二里头宫殿遗址","D.浙江余姚河姆渡遗址"],"right":2,"ans":"C","desc":"二里头遗址出现较明确的宫殿式院落建筑，是我国早期庭院式建筑的重要实例。"},{"type":"single","q":"天安门的屋顶形式是（）。","options":["A.庑殿顶","B.歇山顶","C.攒尖顶","D.悬山顶"],"right":0,"ans":"A","desc":"天安门现存建筑采用重檐歇山顶的等级形式；题目截图中的选项文字存在OCR误差，需以原图为准。"},{"type":"single","q":"中国传统古代木结构中“减柱”“移柱”的做法属于哪个时代？","options":["A.宋代","B.元代","C.明代","D.清代"],"right":1,"ans":"B","desc":"“减柱”“移柱”是元代木构建筑中常见的空间处理手法。"},{"type":"single","q":"折板结构按结构断面形式主要包括（）。","options":["A.三角形折板","B.梯形折板","C.方形折板","D.椭圆形折板"],"right":0,"ans":"A","desc":"题目资料按结构断面形式列举三角形、梯形等折板形式；方形、椭圆形并非该题采用的基本分类。"},{"type":"single","q":"下列基础中不属于刚性基础的是（）。","options":["A.砖基础","B.毛石基础","C.钢筋混凝土基础","D.素混凝土基础"],"right":2,"ans":"C","desc":"钢筋混凝土基础具有较强的抗弯性能，属于柔性基础；砖、毛石、素混凝土基础通常归入刚性基础。"},{"type":"single","q":"抹灰按质量要求和主要工序不同划分为（）。","options":["A.普通、中级、高级抹灰","B.普通、中级、特级抹灰","C.水刷石、斩假石、干粘石","D.一般、高级、装饰抹灰"],"right":0,"ans":"A","desc":"《建筑装饰装修工程质量验收标准》将抹灰按质量要求和主要工序分为普通抹灰、中级抹灰和高级抹灰。"},{"type":"single","q":"平板网架的排水坡度一般为（）。","options":["A.2%～5%","B.0.5%～2%","C.5%～8%","D.8%～10%"],"right":0,"ans":"A","desc":"平板网架屋面通常通过网架节点高差、支托等形成排水坡度，常用坡度约为2%～5%。"},{"type":"single","q":"采用彩板屋面时，当屋面板波高超过多少时，应设檩条连接？","options":["A.15mm","B.25mm","C.35mm","D.40mm"],"right":2,"ans":"C","desc":"题目资料答案为35mm，超过该波高时需要采取相应檩条连接措施以保证屋面稳定。"},{"type":"single","q":"分件式玻璃幕墙竖框与主体结构之间通常应留出多少毫米左右的间距？","options":["A.30mm","B.50mm","C.100mm","D.120mm"],"right":2,"ans":"C","desc":"幕墙竖向龙骨与主体结构之间通常预留约100mm空间，用于安装调节、变形及连接处理。"},{"type":"single","q":"勒杜把建筑还原为基本几何形体，对装饰几乎完全摒弃，这显然是（ ）的先声。","options":["A.现代主义","B.沙利文","C.后现代主义","D.文丘里"],"right":0,"ans":"A","desc":"克劳德·尼古拉·勒杜的几何化、纯粹化倾向被视为现代建筑形式观念的重要先声。"},{"type":"single","q":"对当时维也纳城市改造提出主张、提倡以中世纪或文艺复兴方式规划近代城市的是（）。","options":["A.卡米洛·西谛","B.柯布西耶","C.瓦格纳","D.赖特"],"right":0,"ans":"A","desc":"卡米洛·西谛强调从历史城市形态和空间艺术出发进行近代城市设计。"},{"type":"single","q":"我国佛教四大名山是指（）。","options":["A.五台山、九华山、峨眉山、普陀山","B.五台山、普陀山、武当山、峨眉山","C.武当山、九华山、峨眉山、普陀山","D.武当山、九华山、泰山、普陀山"],"right":0,"ans":"A","desc":"我国佛教四大名山为山西五台山、安徽九华山、四川峨眉山、浙江普陀山。"},{"type":"single","q":"对于沙利文来说，“功能”问题指的是（）。","options":["A.使用问题","B.内在力量的外在表达","C.纯粹的物理功能","D.精神功能"],"right":1,"ans":"B","desc":"沙利文“形式追随功能”中的功能不仅是使用功能，还强调建筑内在生命力和本质的外在表达。"},{"type":"single","q":"下列哪项不符合赖特为草原住宅提出的设计方针？","options":["A.空间水平展开","B.符合机械美学","C.与周围环境协调","D.满足个性需求"],"right":1,"ans":"B","desc":"赖特草原住宅强调有机建筑、水平延展、与环境协调和个性化，而“机械美学”不是其核心主张。"},{"type":"single","q":"下列建筑中，采用“对比均衡”构图手法的是（）。","options":["A.巴黎圣母院","B.巴西利亚国会大厦","C.西西里亚国会大厦","D.悉尼歌剧院"],"right":1,"ans":"B","desc":"巴西利亚国会大厦通过水平与竖向体量形成鲜明对比，是对比均衡构图的典型实例。"},{"type":"single","q":"古希腊帕特农神庙柱身向建筑中央倾斜的手法是（）。","options":["A.收分","B.对称","C.视觉矫正","D.宫殿式"],"right":2,"ans":"C","desc":"古希腊建筑通过柱身内倾、柱顶略向上拱等视觉矫正手法，使建筑在视觉上更稳定。"},{"type":"single","q":"关于贝聿铭设计的苏州博物馆，错误的是（）。","options":["A.采用几何化形体","B.与苏州传统建筑环境相协调","C.完全采用严格对称的传统中式布局","D.运用现代材料表达传统意境"],"right":2,"ans":"C","desc":"苏州博物馆并非完全严格对称，而是结合现代空间组织与苏州传统园林、建筑意境。"},{"type":"single","q":"贝聿铭巴黎卢浮宫改扩建玻璃金字塔的说法，错误的是（）。","options":["A.增加卢浮宫新的入口","B.为地下空间提供自然采光","C.增加地下建筑系统","D.把参观流线完全固定为单一顺序"],"right":3,"ans":"D","desc":"玻璃金字塔组织了地下空间和交通，但并未把参观流线固定为单一顺序，而是提供更灵活的联系。"},{"type":"single","q":"有关火车站、体育馆人流特征，说法正确的是（）。","options":["A.都是连续人流","B.都是集中人流","C.火车站是连续人流，体育馆是集中人流","D.体育馆是连续人流，火车站是集中人流"],"right":2,"ans":"C","desc":"体育馆人流在比赛前后具有明显集中性；火车站则兼有连续性和集中性，但题目给出的标准答案为“火车站连续、体育馆集中”。"},{"type":"single","q":"超高层建筑设计中，不用特别关注的是（）。","options":["A.风荷载","B.结构体系","C.垂直交通","D.对外开窗"],"right":3,"ans":"D","desc":"超高层建筑需重点关注风效应、结构安全和垂直交通；对外开窗相对不是首要控制问题。"},{"type":"single","q":"下列公共建筑中，按照一定流程序列组织流线的是（）。","options":["A.办公楼","B.住宅","C.剧场","D.入站大厅"],"right":3,"ans":"D","desc":"车站进站空间需要依次完成人流组织、安检等流程，具有较明确的流程序列。"},{"type":"single","q":"音乐厅室内平面形状，有利于组织前次反射声并使声场分布均匀的是（）。","options":["A.正八边形","B.长方形","C.圆形","D.扇形"],"right":0,"ans":"A","desc":"正八边形等多边形平面有利于组织早期反射声并改善声场均匀性。"},{"type":"single","q":"在我国住宅规划与建筑设计中，与节地目标相悖的是（）。","options":["A.采用南向凹台住宅","B.提高住宅建筑密度","C.降低层数","D.采用小面宽、大进深"],"right":0,"ans":"A","desc":"南向凹台住宅可能减少建筑有效使用面积并增加日照开口等需求，题目资料将其作为与节地目标相悖的选项。"},{"type":"single","q":"住宅功能分区不包括（）。","options":["A.生理分区","B.动静分区","C.公私分区","D.洁污分区"],"right":0,"ans":"A","desc":"住宅户内常见功能分区包括公私、动静、洁污等；“生理分区”不是通常采用的独立功能分区类型。"},{"type":"single","q":"二次世界大战后，位于纽约的联合国总部的选址及建筑设计主要采纳了哪位建筑师的方案？","options":["A.勒·柯布西耶","B.密斯·凡·德·罗","C.华莱士·哈里森","D.赖特"],"right":2,"ans":"C","desc":"联合国总部建筑群的总体组织与设计由华莱士·哈里森等建筑师团队负责，题目标准答案为哈里森。"},{"type":"single","q":"公共建筑的人流组织中，正常使用与紧急情况下的基本方向分别是（）。","options":["A.均由外向内","B.公众外向内、工作人员内向外","C.正常外向内、紧急内向外","D.正常内向外、紧急外向内"],"right":2,"ans":"C","desc":"正常使用时人流由外向内进入建筑；紧急疏散时人流由内向外。"},{"type":"single","q":"我国一般建筑物屋顶材料首先应综合满足（）。","options":["A.经济、美观、实用","B.强度、坚固、卫生","C.可燃、隔声、防腐","D.防火、防水、保温"],"right":3,"ans":"D","desc":"屋顶材料首先应满足防火、防水、保温等基本性能要求。"},{"type":"single","q":"城市居住区规划中，与公共服务配套设施指标制定和计算无关的指标是（）。","options":["A.居住区分级对应的居住人口规模","B.居住区分级","C.服务半径","D.建筑风格"],"right":3,"ans":"D","desc":"公共服务设施指标主要与居住人口规模、居住区分级及服务半径等有关，建筑风格不是计算指标。"},{"type":"single","q":"申报国家历史文化名城、名镇、名村的条件要求不包括（）。","options":["A.非物质文化遗产丰富","B.历史建筑成片","C.保存传统格局和历史风貌","D.历史上曾经作为政治、经济、文化、交通中心或者军事要地"],"right":0,"ans":"A","desc":"历史文化名城等认定主要依据物质历史遗存、传统格局和历史作用等条件，非物质文化遗产丰富并非题目所列必要条件。"},{"type":"single","q":"历史文化名城保护规划中的建筑高度控制规划依据不包括（）。","options":["A.历史城区高度分区","B.建筑风格的要求","C.重要视线廊道及视域内建筑高度","D.历史城区范围的建筑高度控制"],"right":1,"ans":"B","desc":"建筑高度控制主要依据高度分区、重要视线廊道及历史城区范围等，建筑风格要求不是该条款列举的直接高度控制依据。"},{"type":"single","q":"城市生态适宜性分析步骤不包括（）。","options":["A.明确规划目标并确定规划方案与环境因子的关系","B.评价各因子对规划目标的适宜性并分级","C.将各因子适宜性绘制在图上形成生态适宜性评价图","D.进行生态适宜性实施效果预测和评价"],"right":3,"ans":"D","desc":"生态适宜性分析主要完成目标、因子评价、分级和图示综合；实施效果预测评价属于后续规划实施评价内容。"},{"type":"single","q":"城市生态功能区划原则不包括（）。","options":["A.主导功能原则","B.区域相关性原则","C.坚持绝对独立性原则","D.协调原则"],"right":2,"ans":"C","desc":"生态功能区划强调主导功能、区域相关性和协调等原则，并不强调各生态系统绝对独立。"},{"type":"single","q":"下列哪项不属于典型的住区结构模式？","options":["A.行列式","B.周边式","C.中心院落式","D.自由散点式"],"right":3,"ans":"D","desc":"住区空间结构的典型模式包括行列式、周边式、中心院落式、轴向式等，题目资料未将自由散点式列为典型模式。"},{"type":"single","q":"城市居住区规划中，与公共服务配套设施指标制定和计算无关的是（）。","options":["A.居住人口规模","B.居住区分级","C.服务半径","D.建筑风格"],"right":3,"ans":"D","desc":"公共服务设施的规模和配置与人口规模、分级和服务半径等有关。"},{"type":"single","q":"下列住区技术经济指标计算的表述，错误的是（）。","options":["A.住宅用地容积率为住宅及其便民服务设施总建筑面积与住宅用地面积的比值","B.建筑密度为建筑基底面积与居住街坊用地面积的比值","C.绿地率为居住街坊内绿地面积之和与居住街坊用地面积的比值","D.住宅建筑平均层数等于住宅总建筑面积除以住宅建筑密度"],"right":3,"ans":"D","desc":"住宅建筑平均层数应以住宅总建筑面积与住宅建筑基底总面积的比值确定，D项表述错误。"},{"type":"single","q":"关于建筑师终身负责制的判断题改编：建筑师终身负责制是针对所有建筑师的。","options":["A.正确","B.错误"],"right":1,"ans":"B","desc":"建筑师负责制针对项目负责人等相应责任主体，并非所有建筑师一概适用。"},{"type":"single","q":"城市噪声环境中影响最大的噪声源是（）。","options":["A.社会生活噪声","B.建筑施工噪声","C.工业噪声","D.交通噪声"],"right":3,"ans":"D","desc":"城市环境中交通活动产生的噪声通常是主要噪声源之一。"},{"type":"single","q":"西尔斯（威利斯）大厦采用（）。","options":["A.筒中筒结构","B.束筒结构","C.单筒结构","D.框架—核心筒结构"],"right":1,"ans":"B","desc":"西尔斯大厦采用束筒结构，是高层建筑结构体系的经典实例。"},{"type":"single","q":"赖特的作品是（）。","options":["A.哈佛研究生中心","B.西门子住宅","C.流水别墅","D.英国平顿乡村学院"],"right":2,"ans":"C","desc":"流水别墅是弗兰克·劳埃德·赖特的代表作。"},{"type":"single","q":"田园城市理论由谁提出？","options":["A.霍华德","B.勒·柯布西耶","C.简·雅各布斯","D.奥姆斯特德"],"right":0,"ans":"A","desc":"埃比尼泽·霍华德提出田园城市理论。"},{"type":"single","q":"《建筑十书》的作者是（）。","options":["A.维特鲁威","B.阿尔伯蒂","C.米开朗琪罗","D.帕拉第奥"],"right":0,"ans":"A","desc":"《建筑十书》由古罗马建筑师维特鲁威所著。"},{"type":"single","q":"容积率的计算公式是（）。","options":["A.建筑基底面积÷土地总面积","B.总建筑面积÷土地总面积","C.绿地面积÷总建筑面积","D.建筑高度÷土地周长"],"right":1,"ans":"B","desc":"容积率=总建筑面积÷建设用地面积。"},{"type":"single","q":"被誉为“文艺复兴报春花”的佛罗伦萨大教堂穹顶设计者是（）。","options":["A.米开朗琪罗","B.阿尔伯蒂","C.伯鲁乃列斯基","D.帕拉第奥"],"right":2,"ans":"C","desc":"佛罗伦萨主教堂穹顶由伯鲁乃列斯基设计，是文艺复兴建筑的重要标志。"},{"type":"single","q":"我国现存最早的木构建筑是（）。","options":["A.应县木塔","B.南禅寺大殿","C.佛光寺大殿","D.晋祠圣母殿"],"right":1,"ans":"B","desc":"南禅寺大殿建于唐代，是我国现存最早的木构建筑之一。"},{"type":"single","q":"日本代代木体育场采用的主要结构形式是（）。","options":["A.网架","B.悬索","C.折板","D.桁架"],"right":1,"ans":"B","desc":"丹下健三设计的代代木国立体育场采用悬索结构。"},{"type":"single","q":"在建筑变形缝中，需要将基础至屋顶全部断开的是（）。","options":["A.沉降缝","B.防震缝","C.伸缩缝","D.所有变形缝"],"right":0,"ans":"A","desc":"沉降缝需要从基础至屋顶全部断开，以适应相邻建筑或结构单元的不均匀沉降。"},{"type":"single","q":"阿尔瓦·阿尔托的代表建筑是（）。","options":["A.罗比之家","B.流水别墅","C.玛丽亚别墅","D.汉纳住宅"],"right":2,"ans":"C","desc":"玛丽亚别墅是阿尔瓦·阿尔托的重要代表作。"},{"type":"single","q":"西尔斯大厦的结构体系是（）。","options":["A.框架—剪力墙","B.筒中筒","C.核心筒—框架","D.束筒"],"right":3,"ans":"D","desc":"西尔斯大厦采用束筒结构体系。"},{"type":"single","q":"中央商务区的英文缩写是（）。","options":["A.TOD","B.CBD","C.CCD","D.CTD"],"right":1,"ans":"B","desc":"CBD为Central Business District，即中央商务区。"},{"type":"single","q":"轻钢龙骨石膏板隔墙属于（）。","options":["A.砖墙","B.混凝土墙","C.骨架隔墙","D.钢结构墙"],"right":2,"ans":"C","desc":"轻钢龙骨作为骨架、石膏板作为面层，属于骨架隔墙。"},{"type":"single","q":"田园城市理论的提出者是（）。","options":["A.霍华德","B.柯布西耶","C.简·雅各布斯","D.奥姆斯特德"],"right":0,"ans":"A","desc":"霍华德提出田园城市理论。"},{"type":"single","q":"城市规划中“CBD”指的是（）。","options":["A.交通导向开发","B.中央商务区","C.中央文化区","D.综合交通区"],"right":1,"ans":"B","desc":"CBD即中央商务区。"},{"type":"single","q":"城市空间中用于识别方向、具有突出特征的物体称为林奇五要素中的（）。","options":["A.道路","B.边界","C.节点","D.标志物"],"right":3,"ans":"D","desc":"凯文·林奇的五要素包括道路、边界、区域、节点和标志物。"},{"type":"single","q":"声波频率越低，其绕射能力（）。","options":["A.越弱","B.不变","C.越强","D.无法判断"],"right":2,"ans":"C","desc":"低频声波波长较长，绕射能力通常更强。"},{"type":"fill","q":"石材贴面分块材和板材，其中块材厚度一般为多少mm，板材厚度一般为多少mm？","ans":"块材40-130mm；板材30-40mm","desc":"石材贴面按规格可分块材和板材：块材厚度约40-130mm，板材约30-40mm。"},{"type":"fill","q":"花岗岩和大理石在耐久性方面有什么主要区别？","ans":"花岗岩密实、吸水率小、坚固耐用，抗酸抗碱抗风化；大理石较软且不耐酸碱，一般用于室内装修","desc":"花岗岩耐久性和耐候性较好；大理石较软且不耐酸碱，因此常用于室内装修。"},{"type":"fill","q":"石材墙面粘贴法适用于墙面高度不大于多少m？","ans":"3m","desc":"石材墙面粘贴法适用于高度不大于3m的墙面。"},{"type":"fill","q":"骨架基层的龙骨中距一般不超过多少mm？","ans":"600mm","desc":"骨架基层龙骨中距视情况确定，一般不超过600mm。"},{"type":"fill","q":"人造石材采用栓接法时，板材厚度一般为多少mm；采用粘接法时一般为多少mm？","ans":"栓接法20-30mm；粘接法8-12mm","desc":"人造石材栓接法板材一般20-30mm，粘接法一般8-12mm。"},{"type":"fill","q":"饰面抹灰按工序分为底灰、中灰、面灰，其厚度一般分别为多少mm？","ans":"底灰5-7mm；中灰5-9mm；面灰2-8mm","desc":"底灰起粘接和初步找平作用，中灰进一步找平，面灰主要起装饰作用。"},{"type":"fill","q":"墙裙和护角的高度一般为多少m？踢脚线一般为多少mm？","ans":"墙裙和护角2m；踢脚线120-150mm","desc":"墙裙、护角通常做到约2m高；踢脚线一般120-150mm。"},{"type":"fill","q":"实铺木地板中，木板与毛毡的接缝应错开多少角度？","ans":"45°或90°","desc":"实铺木地板铺设时，木板与毛毡之间的接缝应错开45°或90°。"},{"type":"fill","q":"成人楼梯踏步的最小尺寸，踏步宽和踏步高分别是多少mm？","ans":"260mm；175mm","desc":"成人楼梯踏步最小尺寸可记为宽260mm、高175mm。"},{"type":"fill","q":"楼梯平台宽度一般不应小于多少mm？医院楼梯还应保证担架通行宽度不小于多少mm？","ans":"1200mm；1800mm","desc":"一般平台宽度≥1200mm；医院应保证担架通行，相关宽度取≥1800mm。"},{"type":"fill","q":"梯井宽度一般为多少mm？","ans":"60-110mm","desc":"梯井宽度一般控制在60-110mm。"},{"type":"fill","q":"梯段扶手高度一般不应小于多少mm？当依靠梯井一侧水平超过500mm时，扶手高度应不小于多少mm？","ans":"900mm；1050mm","desc":"一般梯段扶手≥900mm；依靠梯井一侧水平超过500mm时提高到≥1050mm。"},{"type":"fill","q":"楼梯梯段净高和平台净高分别不应小于多少mm？","ans":"2200mm；2000mm","desc":"梯段净高≥2200mm，平台净高≥2000mm。"},{"type":"fill","q":"室外台阶踏步高度和宽度分别宜为多少mm？平台深度一般不小于多少mm？无障碍时不小于多少mm？","ans":"120-150mm；300-350mm；1000mm；1500mm","desc":"室外台阶踏步高120-150mm、宽300-350mm；平台深度≥1000mm，无障碍时≥1500mm。"},{"type":"fill","q":"轮椅坡道单轮椅通行宽度不应小于多少mm？坡度不应大于多少？","ans":"1200mm；1/12","desc":"单轮椅坡道宽度≥1200mm，坡度≤1/12。"},{"type":"fill","q":"轮椅坡道扶手通常设置在多少mm和多少mm高度处？","ans":"850-900mm；650-700mm","desc":"无障碍坡道扶手双设，上层约850-900mm，下层约650-700mm。"},{"type":"fill","q":"坡道起始水平扶手应向前延伸多少mm以上？栏杆下端安全挡台高度不应小于多少mm？","ans":"300mm；50mm","desc":"坡道扶手起始水平段延伸≥300mm，栏杆下端设置≥50mm安全挡台。"},{"type":"fill","q":"按速度，电梯可分为高速、中速和低速，其中高速电梯速度大于多少m/s，中速为多少m/s，低速小于多少m/s？","ans":"高速＞2m/s；中速1.5-2m/s；低速＜1.5m/s","desc":"按题库资料：高速＞2m/s，中速1.5-2m/s，低速＜1.5m/s。"},{"type":"fill","q":"电扶梯常用倾角是多少？常用速度是多少m/s？常见梯级宽度有哪些？","ans":"30°；0.5m/s；600mm、800mm、1000mm、1200mm","desc":"电扶梯常用30°，速度约0.5m/s，常见宽度有600、800、1000、1200mm。"},{"type":"fill","q":"伊利尔·沙里宁《城市：它的发展、衰败与未来》提出了什么城市理论？","ans":"有机疏散理论","desc":"沙里宁提出有机疏散理论，主张将大城市无序集中分解为既分散又相互联系的功能单元。"},{"type":"fill","q":"伊利尔·沙里宁的代表作之一是芬兰的什么建筑？","ans":"赫尔辛基火车站","desc":"赫尔辛基火车站是沙里宁的重要代表作品。"},{"type":"fill","q":"罗伯特·文丘里的《建筑的复杂性与矛盾性》发表于哪一年？","ans":"1966年","desc":"《建筑的复杂性与矛盾性》出版于1966年，是后现代主义建筑理论的重要著作。"},{"type":"fill","q":"文丘里用什么口号反对现代主义“少即是多”？","ans":"少即是乏味（Less is a bore）","desc":"文丘里反对现代主义的纯粹与理性，提出“少即是乏味”。"},{"type":"fill","q":"卡米洛·西特的代表著作《城市建设艺术》发表于哪一年？","ans":"1889年","desc":"西特在《城市建设艺术》中强调从艺术和人的视觉心理出发进行城市设计。"},{"type":"fill","q":"卡米洛·西特的城市设计理论主要推崇什么样的城市空间形态？","ans":"自然有机、不规则、围合感强的城市空间形态","desc":"西特批判僵化几何主义和功能主义，推崇中世纪城市自然、有机、不规则且围合感强的空间。"},{"type":"fill","q":"齐康的代表著作《城市建筑》的核心思想是什么？","ans":"城市是建筑的扩大，建筑是城市的缩影，两者不可分割","desc":"齐康强调建筑与城市应作为整体研究，提出“城市建筑学”的思想。"},{"type":"single","q":"下列关于石材墙面粘贴法的说法正确的是？","options":["A.适用于高度不大于3m的墙面","B.适用于所有超高层外墙","C.只能用于室内地面","D.适用于高度超过10m的墙面"],"right":0,"ans":"A","desc":"石材墙面粘贴法适用于高度不大于3m的墙面。"},{"type":"single","q":"下列哪一种材料一般较软且不耐酸碱，常用于室内装修？","options":["A.花岗岩","B.大理石","C.钢材","D.玻璃"],"right":1,"ans":"B","desc":"大理石较软且不耐酸碱，一般用于室内装修。"},{"type":"single","q":"成人楼梯踏步最小尺寸通常为？","options":["A.宽260mm、高175mm","B.宽175mm、高260mm","C.宽220mm、高200mm","D.宽300mm、高220mm"],"right":0,"ans":"A","desc":"成人楼梯踏步最小尺寸可记为宽260mm、高175mm。"},{"type":"single","q":"医院建筑楼梯在平台及交通宽度方面应重点保证什么？","options":["A.担架通行，相关宽度≥1800mm","B.仅满足儿童通行","C.平台宽度可小于1200mm","D.无需考虑疏散"],"right":0,"ans":"A","desc":"医院应保证担架通行，相关宽度取≥1800mm。"},{"type":"single","q":"关于无障碍坡道，下列说法正确的是？","options":["A.单轮椅通行宽度≥1200mm，坡度≤1/12","B.单轮椅通行宽度≥600mm，坡度≤1/6","C.坡度必须大于1/12","D.扶手只设置一层"],"right":0,"ans":"A","desc":"单轮椅坡道宽度≥1200mm，坡度≤1/12，扶手通常双设。"},{"type":"single","q":"“有机疏散理论”的提出者是？","options":["A.卡米洛·西特","B.伊利尔·沙里宁","C.罗伯特·文丘里","D.齐康"],"right":1,"ans":"B","desc":"伊利尔·沙里宁提出有机疏散理论。"},{"type":"single","q":"《城市建设艺术》的作者是？","options":["A.伊利尔·沙里宁","B.卡米洛·西特","C.罗伯特·文丘里","D.齐康"],"right":1,"ans":"B","desc":"《城市建设艺术》是卡米洛·西特的重要著作。"},{"type":"single","q":"下列哪项最符合文丘里对现代主义“少即是多”的回应？","options":["A.少即是乏味","B.形式追随功能","C.装饰即罪恶","D.机器即建筑"],"right":0,"ans":"A","desc":"文丘里提出“少即是乏味（Less is a bore）”，强调建筑应包容复杂、矛盾和历史符号。"},{"type":"single","q":"齐康“城市建筑学”思想强调？","options":["A.建筑与城市完全分离研究","B.城市是建筑的扩大，建筑是城市的缩影","C.只研究建筑单体形式","D.只研究城市交通"],"right":1,"ans":"B","desc":"齐康主张将建筑与城市作为整体研究，强调二者不可分割。"}]};

submitFill.onclick=()=>{
if(answered)return;
const userAns=fillInput.value.trim().replace(/[\s，,；;。．]/g,"");
const correctAns=item.ans.trim().replace(/[\s，,；;。．]/g,"");
if(!userAns){fillResult.innerText="请先输入答案。";return;}
answered=true;
if(userAns===correctAns){score++;fillResult.innerText="✅ 回答正确";fillResult.style.color="#16a34a";}
else{fillResult.innerText="❌ 回答错误，请查看下面的正确答案与解析";fillResult.style.color="#dc2626";}
scoreText.innerText=`得分：${score}`;
ansWrap.style.display="block";
};
fillInput.addEventListener("keydown",e=>{if(e.key==="Enter")submitFill.click();});
}
else if(item.type==="single"){
item.options.forEach((optStr,i)=>{
const div=document.createElement("div");
div.className="option-item";
div.innerText=optStr;

div.onclick=()=>{
if(answered)return;
answered=true;

if(i===item.right){
score++;
div.classList.add("correct");
}else{
div.classList.add("wrong");
optBox.children[item.right]?.classList.add("correct");
}

scoreText.innerText=`得分：${score}`;
ansWrap.style.display="block";
};

optBox.appendChild(div);
});
}
else if(item.type==="judge"){
const trueDiv=document.createElement("div");
trueDiv.className="option-item";
trueDiv.innerText="✅正确";

const falseDiv=document.createElement("div");
falseDiv.className="option-item";
falseDiv.innerText="❌错误";

function judgeAnswer(value,selectedDiv,correctDiv){
if(answered)return;
answered=true;

if(value===item.rightAns){
score++;
selectedDiv.classList.add("correct");
}else{
selectedDiv.classList.add("wrong");
correctDiv.classList.add("correct");
}

scoreText.innerText=`得分：${score}`;
ansWrap.style.display="block";
}

trueDiv.onclick=()=>judgeAnswer(true,trueDiv,item.rightAns?trueDiv:falseDiv);
falseDiv.onclick=()=>judgeAnswer(false,falseDiv,item.rightAns?trueDiv:falseDiv);

optBox.appendChild(trueDiv);
optBox.appendChild(falseDiv);
}
}


showAnsBtn.onclick=()=>{
ansWrap.style.display="block";
};

prevBtn.onclick=()=>{
currentIdx--;
if(currentIdx<0)currentIdx=0;
render();
};

nextBtn.onclick=()=>{
currentIdx++;
if(currentIdx>=qList.length){
alert(`✅试卷完成！一共${qList.length}题，得分：${score}`);
resetState();
return;
}
render();
};

resetState();
</script>
</body>
</html>
